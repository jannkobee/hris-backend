server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /backend/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|webp)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; }
}
