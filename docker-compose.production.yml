name: hris-production

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${DOMAIN}
  APP_KEY: ${APP_KEY}
  LOG_CHANNEL: stderr
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  SESSION_SECURE_COOKIE: "true"
  SECURITY_HSTS_ENABLED: "true"
  AUDIT_LOG_SIGNING_KEY: "${AUDIT_LOG_SIGNING_KEY:-${APP_KEY}}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  BROADCAST_DRIVER: "${BROADCAST_DRIVER:-reverb}"
  REVERB_APP_ID: "${REVERB_APP_ID:-hris-app}"
  REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  REVERB_APP_SECRET: "${REVERB_APP_SECRET:-}"
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_PUBLIC_HOST: "${DOMAIN}"
  REVERB_PUBLIC_PORT: 443
  REVERB_PUBLIC_SCHEME: https
  FRONTEND_URL: https://${DOMAIN}
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN}
  MAIL_MAILER: ${MAIL_MAILER}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}

x-app-env: &app-env
  <<: *env
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  BILLING_PORTAL_RETURN_HOSTS: ${BILLING_PORTAL_RETURN_HOSTS:-localhost}

x-http-app-env: &http-app-env
  <<: *app-env
  PLATFORM_PROVISIONING_KEY: ${PLATFORM_PROVISIONING_KEY}

services:
  mysql:
    image: ${MYSQL_IMAGE}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., dockerfile: deploy/Dockerfile.production }
    environment: *app-env
    command: php artisan migrate --force
    depends_on: { mysql: { condition: service_healthy } }
    restart: "no"
  app:
    build: { context: ., dockerfile: deploy/Dockerfile.production }
    environment: *http-app-env
    volumes: [backend-storage:/var/www/html/storage/app]
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  api:
    image: nginx:1.27-alpine
    volumes:
      [
        ./deploy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro,
        ./:/var/www/html:ro,
      ]
    depends_on: { app: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  queue:
    build: { context: ., dockerfile: deploy/Dockerfile.production }
    environment: *app-env
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  scheduler:
    build: { context: ., dockerfile: deploy/Dockerfile.production }
    environment: *app-env
    command: php artisan schedule:work
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  reverb:
    build: { context: ., dockerfile: deploy/Dockerfile.production }
    environment: *env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_BIND_ADDRESS:-127.0.0.1}:${REVERB_PORT_FORWARD:-8082}:8080"
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$socket = @fsockopen('127.0.0.1', 8080); exit($$socket === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ../hris-frontend
      args:
        VITE_API_URL: "https://${DOMAIN}/backend/api/v1"
    volumes:
      - ./deploy/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT_FORWARD:-8081}:80"
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes: { mysql-data: {}, redis-data: {}, backend-storage: {} }
